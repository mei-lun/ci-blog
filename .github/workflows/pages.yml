name: Pages
on:
  push:
    branches: ["gh-pages"]  # 触发条件不变

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, 'deploy')}}
    steps:
      - uses: actions/checkout@v4
        with:
          #token: ${{ secrets.GITHUB_TOKEN }}
          token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          submodules: recursive
      - name: 更新子模块到最新提交
        run: git submodule update --init --remote --recursive
      - name: 显示子模块状态
        run: git submodule status

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"  # 简化缓存配置

      - name: Install Dependencies
        run: npm cache clean --force
        # 删除 node_modules 和 package-lock.json 以确保全新安装
        run: rm -rf node_modules package-lock.json
        # 重新安装所有依赖，此时会从GitHub拉取 hexo-enhancer 仓库最新的 master 提交
        run: npm install
      - name: Clean Hexo
        run: npx hexo clean
      - name: Build
        run: npm run build  # 确保产物输出到 ./public
      - name: Hexo generate
        run: npx hexo generate

      # 🔥 修正后的部署步骤（关键修改）
      - name: Deploy to ghpage repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 1. 跨仓库地址：格式「你的GitHub用户名/目标仓库名」（无需 https 前缀）
          external_repository: mei-lun/mei-lun
          # 2. 凭证：直接引用 Secrets 中的 PAT（插件会自动识别）
          personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          # 3. 构建产物目录（和你的 npm run build 输出一致）
          publish_dir: ./public
          # 4. 推送到目标仓库的分支（GitHub Pages 默认读取 gh-pages）
          publish_branch: main
          # 5. 提交信息（可选）
          commit_message: ${{ github.event.head_commit.message }}
          # 6. 强制孤儿分支（避免冲突，推荐）
          force_orphan: true
          # 7. 提交者信息（可选，防止提交身份异常）
          user_name: "mei-lun"
          user_email: "848843249@qq.com"
